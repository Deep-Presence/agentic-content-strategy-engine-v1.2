name: Deploy Staging

on:
  push:
    branches: [main]

# Only one staging deploy at a time
concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  # CI runs in parallel but does NOT block deploy
  ci:
    uses: ./.github/workflows/ci.yml

  deploy-backend:
    runs-on: ubuntu-latest
    # No "needs: ci" — deploy proceeds regardless of CI outcome
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy to Railway staging
        run: railway up --service dp-backend --environment staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
