[project]
name = "content-strategy-engine"
version = "0.1.0"
description = "Deep Presence Content Strategy Engine — Research, Gap Analysis & Content Generation pipelines"
requires-python = ">=3.12"
readme = "docs/PROJECT_STATE.md"

dependencies = [
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.0,<3",
    "python-dotenv>=1.0,<2",
    "requests>=2.31,<3",
    "praw>=7.7,<8",
    "langgraph>=0.2",
    "langchain-google-genai>=2.0",
    "perplexityai>=0.2",
    "openai",
    "anthropic",
    "plotly",
    "beautifulsoup4",
    "numpy",
    "scikit-learn",
    "umap-learn",
    "scipy",
    "httpx",
    "playwright",
    "defusedxml>=0.7.0",
    "trafilatura>=1.6.0",
    "textstat>=0.7.0",
    "python-dateutil>=2.9,<3",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "python-multipart>=0.0.12",
    # Database (PostgreSQL + SQLAlchemy + Alembic)
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "pgvector>=0.3",
    # CPS model — Markdown-to-HTML conversion for feature extraction
    "markdown>=3.5.0",
    # Structured logging (Layer 1 — JSON output + contextvars propagation)
    "structlog>=24.1",
    # Google Analytics (GA4) — OAuth + Admin API + Data API
    "google-analytics-data>=0.18.0",
    "google-analytics-admin>=0.22.0",
    "google-auth>=2.20.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    # Robust JSON repair for malformed LLM output
    "json-repair>=0.39",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "scripts*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
